packages:
  - app
  - packages/*

# pnpm 10 defaults this to false and would install first-party packages from
# the registry. Link the checkout, matching the old npm workspaces behavior.
# Published packages must keep a normal caret range (not `workspace:`):
# this repo ships them with `npm publish` (OIDC), which does not rewrite
# workspace protocol.
linkWorkspacePackages: true

# Supply-chain defaults Semgrep asked for (pnpm 10 workspace settings).
blockExoticSubdeps: true
minimumReleaseAge: 10080
trustPolicy: no-downgrade

# no-downgrade compares trust evidence by publish date, not semver, so a
# version published after a provenance-bearing sibling reads as a downgrade
# even when nothing was taken over. Two lockfile pins are false positives of
# that kind and fail every non-frozen resolve (ERR_PNPM_TRUST_DOWNGRADE):
# - @trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1: workbox-build
#   (via vite-plugin-pwa) pins ^3.0.0-pre1; the 3.x prereleases were
#   published without the provenance that 2.x had and 4.x restored, and
#   nothing in workbox's range carries provenance. Drop once workbox
#   depends on a provenance-bearing release.
# - semver@6.3.1: the 6.x backport (2023-07) postdates provenance-bearing
#   7.5.x; Babel tooling still pins ^6.3.1.
# Exact versions only — both are integrity-pinned in pnpm-lock.yaml, and
# any other version of either package stays gated.
trustPolicyExclude:
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
  - 'semver@6.3.1'

# Root package.json `pnpm.overrides` holds two entries, `sharp` and
# `ejs>jake`. Both exist to raise a transitive floor above what the declaring
# package's own range allows, each for a named advisory; neither is a pin of a
# first-party dependency. Dependabot does not read `pnpm.overrides`; when it
# bumps an overridden package it rewrites the lockfile's `overrides:` block to
# the new version while package.json keeps the old one, and every CI job then
# fails with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH under --frozen-lockfile
# (PR #593). The fix is a non-frozen `pnpm install`, which re-resolves under
# the overrides, then a frozen install to prove the lockfile is settled.
# Changing an override is a deliberate change: edit the entry, re-resolve, and
# run the full suite.
#
# Per-override record. Each entry states what it raises, the reason, and the
# condition that would let it go. Removal is a dedicated PR either way: drop
# the entry, re-resolve, and let `.github/workflows/resolve-gate.yml` show
# what a fresh resolve then picks.
#
# sharp: ^0.35.0
#   Build-time image toolchain, reached only through
#   `@vite-pwa/assets-generator` (PWA icon generation) and `sharp-ico`.
#   Reason: GHSA-f88m-g3jw-g9cj (high, dev-only). assets-generator 1.0.2
#   still declares `sharp: ^0.33.5` and sharp-ico declares `*`, so without
#   this override a fresh resolve lands back on the vulnerable 0.33 line
#   (commit 0ca3b2a7).
#   Drop when `@vite-pwa/assets-generator` publishes a sharp range that
#   already excludes the advisory.
#
# ejs>jake: ^12.10.1
#   Scoped: jake only where `ejs` depends on it. ejs 3.1.10 declares
#   `jake: ^10.8.5`; jake 12 pulls filelist 2, minimatch 10.2, and
#   brace-expansion ^5.0.8.
#   Reason: GHSA-mh99-v99m-4gvg (brace-expansion DoS) has no patched 1.x or
#   2.x release, and the vite-plugin-pwa to workbox-build to
#   rollup-plugin-off-main-thread to ejs chain still reaches it. ejs lists
#   jake for its own dev tasks and never imports it at runtime, so the
#   override is functionally inert; a full production build including
#   workbox generateSW confirmed that (commit 4d2e5f5f).
#   Drop when nothing under `ejs` resolves a brace-expansion below 5.0.8.
#
# Removed 2026-09-04: highs, react, react-dom, react-is, recharts,
# es-toolkit, immer.
#   All seven arrived together in commit 5c5f4a49 during the npm to pnpm
#   migration, each set to the exact version the outgoing `package-lock.json`
#   had resolved, so the package-manager switch could not quietly move the
#   runtime tree. That migration is long finished. Four of the seven
#   restated a range a first-party manifest already declared — `highs:
#   ^1.15.2` in both packages, `react`/`react-dom: ^19.2.8` in `app` and in
#   planner-ui's peers, `recharts: ^3.10.1` in planner-ui — and held it at
#   its floor, so CI only ever resolved the oldest version a consumer could
#   install. The other three, react-is, es-toolkit and immer, restated
#   ranges from inside recharts' own dependency tree rather than a
#   first-party declaration, and sat interior to those ranges rather than at
#   their floor: es-toolkit 1.49.0 inside recharts' `^1.39.3`, immer 11.1.11
#   inside recharts' `^11.1.8`, react-is 19.2.8 inside recharts' peer
#   `^16.8.0 || ^17.0.0 || ^18.0.0 || ^19.0.0`. Dependabot could not move any
#   of the seven without the lockfile mismatch above, and nothing in the
#   repo's history recorded a version move that any of them had caught.
#   What removing them actually changed: no resolved version moved. react,
#   react-dom and react-is stay 19.2.8, recharts 3.10.1, highs 1.15.2,
#   es-toolkit 1.49.0, immer 11.1.11 — each still satisfies its declared
#   caret range, so a non-frozen resolve kept it. The lockfile lost the
#   overrides' reach into both peer ranges and importer specifiers:
#   `@reduxjs/toolkit`, `react-dom`, `react-redux`, `react-router`,
#   `recharts` and `use-sync-external-store` now record their published peer
#   ranges where they had recorded `react: 19.2.8`, and the seven importer
#   `specifier:` fields that named an exact overridden version (`app`'s
#   react and react-dom; `packages/engine`'s highs; `packages/planner-ui`'s
#   highs, recharts, and its dev-dependency react and react-dom) now record
#   the caret range each manifest already declared.
#   Evidence taken on the re-resolved lockfile: engine 418 files / 6489
#   tests, planner-ui 215 / 2505, web 14 / 94, all green — including the
#   optimizer suite (`optimizePlan.test.ts`, `optimizer.highsMemo.test.ts`
#   and the other `optimizePlan*`/`*adversarialFindings*` files), which is
#   what actually exercises `highs` and is what a solver-version move would
#   fail; `pnpm audit --prod` 0 advisories over 53 production dependencies;
#   both pack smokes green; the app build's bundle budget green with the
#   chart vendor line at 330.7 of 380 KiB; the differential equivalence
#   dump over the 150-member `full` corpus byte-identical against
#   origin/main (600 entries, 0 moved); and `pnpm cases diff` between the
#   pre- and post-removal trees reporting no case deltas — that check runs
#   only `simulatePlan`, not `optimizePlan`, so it does not exercise `highs`
#   and is not the HiGHS-move detector; it is evidence the deterministic
#   projection path itself did not drift.
#   Restore condition, per package: an override comes back only with the
#   concrete test or measured figure that a version move broke named here.
#   The two measured figures a future in-range bump still has to re-measure
#   by hand are the HiGHS wasm bytes in DOCS/features/optimizer.md
#   (3,431,156 bytes at highs 1.15.2) and the chart vendor budget line in
#   DOCS/operations/bundle-budget.md (380 KiB); neither is a reason to hold
#   a floor, because neither is checked by the pin.
#   Known consequence, measured by running this file's resolve gate from
#   scratch on 2026-09-04: with the pins gone, a no-lockfile resolve picks
#   es-toolkit 1.51.0 and immer 11.1.18 (both transitive, inside recharts'
#   tree) rather than the pinned 1.49.0 and 11.1.11. On that date, the other
#   five formerly pinned packages resolved to the same versions from
#   scratch — an observation of that one resolve, not a stable property:
#   their caret ranges let a later fresh resolve pick a newer in-range
#   react, recharts or highs the same as any other dependency. The rest of
#   that resolve's drift (caniuse-lite, rollup, sharp and friends) is
#   ordinary registry movement no pin was holding. The committed lockfile
#   keeps the tested versions throughout. Moving them is now Dependabot's
#   job, under the same full-suite gate as any other dependency bump,
#   rather than something a pin hides.
