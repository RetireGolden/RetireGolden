# Shared runner toolchain: pnpm (from the packageManager pin) and Node, with
# the pnpm store cache keyed on the lockfile. Workspace CI jobs use this
# instead of restating the two SHA-pinned setup steps. The isolated publish
# jobs use the same setup-node pin and Node major directly so they do not need
# a repository checkout. A Node-major or action bump therefore updates this
# action and those two publish jobs together. Jobs using the composite keep
# their own actions/checkout (a repo-local composite is only available after
# checkout) and their own install line, because the install variant differs
# (frozen, lockfile-only, none).
#
# app/src/docsConsistency.test.ts reads `node-version` and setup-node from this
# file, requires workspace jobs to use the composite, and keeps the isolated
# publish jobs aligned with both values.
name: Set up pnpm and Node
description: pnpm via packageManager pin, Node 24 with the pnpm store cache; optional npm registry for publish jobs.
inputs:
  registry-url:
    description: npm registry URL to configure in npmrc (publish jobs only). Leave empty otherwise.
    required: false
    default: ''
  pnpm:
    description: Install pnpm. Set to 'false' for a checked-out job that only needs Node.
    required: false
    default: 'true'
  cache:
    description: Restore the pnpm store cache keyed on the committed lockfile. Set to 'false' for jobs that resolve without it (the fresh-resolve gate) or otherwise avoid the pnpm store.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - if: inputs.pnpm == 'true'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        # An empty `cache` means no caching in actions/setup-node.
        cache: ${{ inputs.pnpm == 'true' && inputs.cache == 'true' && 'pnpm' || '' }}
        cache-dependency-path: pnpm-lock.yaml
        registry-url: ${{ inputs.registry-url }}
