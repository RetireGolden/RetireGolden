version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Pinned to the v1 branch tip by hand; Dependabot resolves this action to
      # a stale 2021 SHA cited in Azure's docs and would downgrade the pin.
      - dependency-name: "Azure/static-web-apps-deploy"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
  # The semgrep CLI pin (.github/requirements.txt) that
  # .github/workflows/semgrep.yml installs.
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
  # The pnpm workspace: root manifest, app, and both packages. Bumps newer
  # than pnpm-workspace.yaml's minimumReleaseAge fail the resolve gate until
  # they age in; that is expected, not a Dependabot fault.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript is pinned `~6.0.x` in every workspace on purpose: the 7.x
      # line is outside typescript-eslint's declared peer range, so a major
      # bump breaks the required lint job (PR #594). Minors and patches
      # within 6.x still flow.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the runtime major. The repo runs Node 24
      # (engines >=24, CI node-version '24'); a newer types major lets code
      # type-check against APIs Node 24 does not have (PR #595). Bump it by
      # hand when the runtime floor moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
