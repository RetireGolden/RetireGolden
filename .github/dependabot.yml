version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Pinned to the v1 branch tip by hand; Dependabot resolves this action to
      # a stale 2021 SHA cited in Azure's docs and would downgrade the pin.
      - dependency-name: "Azure/static-web-apps-deploy"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
  # The semgrep CLI pin (.github/semgrep-requirements.txt) that
  # .github/workflows/semgrep.yml installs.
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
  # The pnpm workspace: root manifest, app, and both packages. Bumps newer
  # than pnpm-workspace.yaml's minimumReleaseAge fail the resolve gate until
  # they age in; that is expected, not a Dependabot fault.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
