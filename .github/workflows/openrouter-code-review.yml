# Thin caller for the org-required OpenRouter PR review.
# Implementation lives in RetireGolden/.github — do not copy it here.
#
# Pass only OPENROUTER_API_KEY. Do not inherit.
#
# OpenRouter is independent of Grok: this caller passes only
# OPENROUTER_API_KEY and the reusable never invokes a Grok fallback.
# The stable required-check context is:
#
#   review / openrouter-first-pass-gate
#
# Main Guard must migrate once from `review / grok-first-pass-gate` to
# that context when this caller is activated.
#
# As of the .github#19 pin (action v1.2.0), synchronize runs a VERIFY
# round that SKIPS with a notice (zero token spend) until a first-pass
# has seeded this PR's review loop. Seed with workflow_dispatch
# (pr_number), or the PR's next reopen / ready_for_review. The stable
# first-pass gate carries a completed initial review across later pushes.
# Per-PR concurrency lives in the org reusable's own
# job-level groups; do not add a workflow-level group here (it could
# cancel an in-progress first-pass).
#
# Dense PRs: since the .github#27 pin (action v1.2.6), an over-budget
# diff (max_diff_kb) is packed per file instead of raw-truncated —
# generated/vendored files demote to stubs that stay coverage-accounted
# and tool-readable — so a fully embedded-or-stubbed diff keeps its real
# verdict and publishes the review-loop ledger (follow-up rounds keep
# continuity). Only files dropped entirely still force `partial`.
# Rewrite this note ONLY if the dense-diff behavior actually changes.
# Since the .github#35 pin (action v1.2.7 unchanged, action PR #20),
# full-PR acquisition falls back to the runner's full-depth
# `git diff base...head` when GitHub rejects a patch over 20,000 lines;
# the complete patch then enters the same dense-diff packing above.
#
# Standard: required GPT-6 Sol (Azure route) + optional GLM 5.3 Flash; Luna judge.
# Deep adds required Astra Flex; effort and limits follow the selected profile.
# Shared configuration: https://github.com/RetireGolden/.github/blob/a40c5eb8d588266531184ffc633dc2969d9138df/.github/workflows/openrouter-code-review.yml
# Policy reference: https://github.com/RetireGolden/.github/blob/a40c5eb8d588266531184ffc633dc2969d9138df/README.md

name: OpenRouter code review
run-name: "${{ format('OpenRouter PR #{0}: {1}', github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number, github.event.client_payload.review_level || inputs.review_level || 'auto') }}"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  repository_dispatch:
    types: [openrouter-review]
  workflow_dispatch:
    inputs:
      review_level:
        description: Follow policy, request deep review, or cancel a pending deep request
        required: false
        type: choice
        options: [auto, deep, cancel]
        default: auto
      pr_number:
        description: PR number to review
        required: true
        type: string
      reset_review:
        description: Legacy input; profile reviews require false to retain findings
        required: false
        type: boolean
        default: false

permissions:
  # Reusable jobs may only narrow this workflow-level permission ceiling. The
  # review job does not receive checks: write; only gate-check does.
  actions: write
  checks: write
  contents: read
  pull-requests: write
  # The central reusable publishes the stable required-gate commit status.
  statuses: write

jobs:
  # During the bootstrap overlap, a branch caller that still declares
  # pull_request owns its review. Once that trigger is removed, the trusted
  # default-branch pull_request_target caller becomes the single owner.
  target-selection:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_review: ${{ steps.owner.outputs.run_review }}
    steps:
      - name: Select the single review trigger
        id: owner
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setOutput('run_review', 'false')
            const pr = context.payload.pull_request
            if (pr.head?.repo?.full_name !== context.payload.repository.full_name) {
              core.info('Fork pull requests are not eligible for the secret-backed target review.')
              return
            }
            const { data } = await github.rest.repos.getContent({
              ...context.repo,
              path: '.github/workflows/openrouter-code-review.yml',
              ref: pr.head.sha,
            })
            if (Array.isArray(data) || data?.type !== 'file' || typeof data.content !== 'string') {
              throw new Error('Pull-request review caller is not a file')
            }
            const source = Buffer.from(data.content.replace(/\s/g, ''), 'base64').toString('utf8')
            if (/^  pull_request:\s*$/m.test(source)) {
              core.info('The branch pull_request trigger owns this review.')
              return
            }
            core.setOutput('run_review', 'true')

  # Keep this id stable: it is the first half of the required check context
  # `review / openrouter-first-pass-gate`.
  review:
    needs: target-selection
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'repository_dispatch' ||
        (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
        (github.event_name == 'pull_request_target' && !github.event.pull_request.draft &&
          needs.target-selection.outputs.run_review == 'true')
      )
    uses: RetireGolden/.github/.github/workflows/openrouter-code-review.yml@a40c5eb8d588266531184ffc633dc2969d9138df # .github#54; action#41@212775ffea22e806cddcb706c73a3df26fbcb6d0
    permissions:
      actions: write
      contents: read
      pull-requests: write
      statuses: write
    with:
      review_policy: base
      review_profiles_enabled: true
      review_level: ${{ github.event.client_payload.review_level || inputs.review_level || 'auto' }}
      reset_review: ${{ inputs.reset_review || false }}
      expected_head_sha: ${{ github.event.client_payload.head_sha || '' }}
      pr_number: ${{ github.event.pull_request.number || github.event.client_payload.pr_number || inputs.pr_number || github.event.inputs.pr_number }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  gate-check:
    needs: review
    if: always() && needs.review.outputs.gate_head_sha != ''
    uses: RetireGolden/.github/.github/workflows/openrouter-review-gate-check.yml@a40c5eb8d588266531184ffc633dc2969d9138df # .github#54
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: read
    with:
      pr_number: ${{ needs.review.outputs.gate_pr_number }}
      head_sha: ${{ needs.review.outputs.gate_head_sha }}
      conclusion: ${{ needs.review.outputs.gate_conclusion }}
      review_url: ${{ needs.review.outputs.gate_review_url }}
