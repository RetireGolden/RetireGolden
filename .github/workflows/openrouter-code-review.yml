# Thin caller for the org-required OpenRouter PR review.
# Implementation lives in RetireGolden/.github — do not copy it here.
#
# Pass only OPENROUTER_API_KEY. Do not inherit.
#
# OpenRouter is independent of Grok: this caller passes only
# OPENROUTER_API_KEY and the reusable never invokes a Grok fallback.
# The stable required-check context is:
#
#   review / openrouter-first-pass-gate
#
# Main Guard must migrate once from `review / grok-first-pass-gate` to
# that context when this caller is activated.
#
# As of the .github#19 pin (action v1.2.0), synchronize runs a VERIFY
# round that SKIPS with a notice (zero token spend) until a first-pass
# has seeded this PR's review loop. Seed with workflow_dispatch
# (pr_number), or the PR's next reopen / ready_for_review. The stable
# first-pass gate carries a completed initial review across later pushes.
# Per-PR concurrency lives in the org reusable's own
# job-level groups; do not add a workflow-level group here (it could
# cancel an in-progress first-pass).
#
# Dense PRs: since the .github#27 pin (action v1.2.6), an over-budget
# diff (max_diff_kb) is packed per file instead of raw-truncated —
# generated/vendored files demote to stubs that stay coverage-accounted
# and tool-readable — so a fully embedded-or-stubbed diff keeps its real
# verdict and publishes the review-loop ledger (follow-up rounds keep
# continuity). Only files dropped entirely still force `partial`.
# Rewrite this note ONLY if the dense-diff behavior actually changes.
#
# The lane roster is decided per-repo INSIDE the reusable (keyed off
# GITHUB_REPOSITORY, frozen at the pinned SHA below). This repo has run
# x-ai/grok-4.6 + z-ai/glm-5.3-flash since the .github#24 pin; a pin
# bump does not change those lanes unless it says so. As of .github#32,
# the separate recall-safe judge that merges them defaults to
# openai/gpt-5.6-luna. The .github#34 pin expands the requested roster
# to the other product repos without changing this repo's lanes. On a
# bump, rewrite the lane and judge notes only when their respective
# defaults actually change.

name: OpenRouter code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  # The central reusable publishes the stable required-gate commit status.
  statuses: write

jobs:
  # Keep this id stable: it is the first half of the required check context
  # `review / openrouter-first-pass-gate`.
  review:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    # Central policy pin: .github#34 configured the requested org roster.
    uses: RetireGolden/.github/.github/workflows/openrouter-code-review.yml@134ac6abb17e27fd893f67622c6c46791f28c463 # .github#34 (org OpenRouter roster)
    with:
      pr_number: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
