# Thin caller for the org-required OpenRouter PR review.
# Implementation lives in RetireGolden/.github — do not copy it here.
#
# Pass only OPENROUTER_API_KEY. Do not inherit.
#
# OpenRouter is independent of Grok: this caller passes only
# OPENROUTER_API_KEY and the reusable never invokes a Grok fallback.
# The stable required-check context is:
#
#   review / openrouter-first-pass-gate
#
# Main Guard must migrate once from `review / grok-first-pass-gate` to
# that context when this caller is activated.
#
# As of the .github#19 pin (action v1.2.0), synchronize runs a VERIFY
# round that SKIPS with a notice (zero token spend) until a first-pass
# has seeded this PR's review loop. Seed with workflow_dispatch
# (pr_number), or the PR's next reopen / ready_for_review. The stable
# first-pass gate carries a completed initial review across later pushes.
# Per-PR concurrency lives in the org reusable's own
# job-level groups; do not add a workflow-level group here (it could
# cancel an in-progress first-pass).
#
# Dense PRs: since the .github#27 pin (action v1.2.6), an over-budget
# diff (max_diff_kb) is packed per file instead of raw-truncated —
# generated/vendored files demote to stubs that stay coverage-accounted
# and tool-readable — so a fully embedded-or-stubbed diff keeps its real
# verdict and publishes the review-loop ledger (follow-up rounds keep
# continuity). Only files dropped entirely still force `partial`.
# Rewrite this note ONLY if the dense-diff behavior actually changes.
# Since the .github#35 pin (action v1.2.7 unchanged, action PR #20),
# full-PR acquisition falls back to the runner's full-depth
# `git diff base...head` when GitHub rejects a patch over 20,000 lines;
# the complete patch then enters the same dense-diff packing above.
#
# The roster is selected per repo inside the pinned reusable, keyed by
# GITHUB_REPOSITORY. On future pin bumps, update these notes when the lane
# roster or judge defaults change.
# The standing roster is x-ai/grok-4.6 + z-ai/glm-5.3-flash with the recall-safe
# openai/gpt-5.6-luna judge. Temporary
# trial windows are documented in the central README at the same pinned revision;
# the policy applies their time limits at runtime.
# Policy and trial dates: https://github.com/RetireGolden/.github/blob/8dfc658b4dbf4502aabb3d4f4387854991952c8d/README.md
# The Sep 5 trial adds openai/gpt-6-astra via openai/flex only when policy
# selection occurs before 2026-09-06T04:00:00Z; at/after that instant only
# the standing roster applies. This condition is in the pinned central policy.

name: OpenRouter code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string
      reset_review:
        description: Discard review history and start over (normally leave false)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  # The central reusable publishes the stable required-gate commit status.
  statuses: write

jobs:
  # Keep this id stable: it is the first half of the required check context
  # `review / openrouter-first-pass-gate`.
  review:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    # Central workflow from .github#38, using action#34's bounded HTTP transport.
    # Preserve review continuity, aggregate timeout diagnostics and posted-review links.
    # v1.3.1 is the preceding release; this pin consumes the reviewed action commit.
    uses: RetireGolden/.github/.github/workflows/openrouter-code-review.yml@8dfc658b4dbf4502aabb3d4f4387854991952c8d # .github#38 (unreleased changes after action v1.3.1; action#34@588955bd9e54909ac39a4729e9e3409b68ed400f)
    with:
      reset_review: ${{ inputs.reset_review || false }}
      pr_number: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
