# Thin caller for the org OpenRouter PR review.
# Implementation lives in RetireGolden/.github — do not copy it here.
# Separate workflow from Grok code review so a failure here cannot red
# review / grok-first-pass-gate or cancel Grok jobs.
#
# Pass only OPENROUTER_API_KEY. Do not inherit.
#
# As of the .github#19 pin (action v1.2.0), synchronize runs a VERIFY
# round that SKIPS with a notice (zero token spend) until a first-pass
# has seeded this PR's review loop. Seed with workflow_dispatch
# (pr_number), or the PR's next reopen / ready_for_review. Still advisory — never a
# required check. Per-PR concurrency lives in the org reusable's own
# job-level groups; do not add a workflow-level group here (it could
# cancel an in-progress first-pass).
#
# The models roster is decided per-repo INSIDE the reusable (keyed off
# GITHUB_REPOSITORY, frozen at the pinned SHA below). As of the
# .github#25 pin this repo runs the two-model roster: x-ai/grok-4.6 +
# z-ai/glm-5.3-flash, merged by the action's recall-safe judge. All
# other org repos stay single-lane. Revisit this note at each pin bump.

name: OpenRouter code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  openrouter:
    name: OpenRouter review
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    uses: RetireGolden/.github/.github/workflows/openrouter-code-review.yml@37a463301702925ac699f3c40b46ce4572213c57 # .github#25 (action v1.2.5 cost + readable findings; this repo: two-model grok-4.6 + glm-5.3-flash + judge)
    with:
      pr_number: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
