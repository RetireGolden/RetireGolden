# Default-branch proof only; never checkout or execute PR code here.
name: OpenRouter profile completion
on:
  workflow_run:
    workflows: [OpenRouter code review]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number; planning also refreshes other open PRs
        required: false
        type: string
permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write
jobs:
  # The shared CI validator authenticates this exact calling job id.
  complete:
    uses: RetireGolden/.github/.github/workflows/openrouter-profile-completion.yml@eac44d1fba1e89760ebf0a1b7826a119e1b6ba79 # .github#42
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      source_run_id: ${{ github.event.workflow_run.id && format('{0}', github.event.workflow_run.id) || '' }}
