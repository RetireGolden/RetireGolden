# Default-branch proof only; never checkout or execute PR code here.
name: OpenRouter profile completion
on:
  workflow_run:
    # Filter on the workflow YAML name; API run.name/display_title use run-name.
    # Verified live: Pro review34246675752 (OpenRouter PR #304: auto) triggered
    # completion34247027718 with event=workflow_run and SOURCE_RUN_ID=34246675752.
    workflows: [OpenRouter code review]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Optional completed review run that requested this proof refresh
        required: false
        type: string
      pr_number:
        description: Optional PR number; planning also refreshes other open PRs
        required: false
        type: string
permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write
jobs:
  # Dispatch from the default branch; other refs intentionally skip this trusted proof.
  # The shared CI validator authenticates this exact calling job id.
  complete:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: RetireGolden/.github/.github/workflows/openrouter-profile-completion.yml@a190c3d834f2e3048b4eef8129fa3c8e10891aa0 # .github#51
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      source_run_id: ${{ inputs.source_run_id || (github.event.workflow_run.id && format('{0}', github.event.workflow_run.id)) || '' }}
