# Default-branch proof only; never checkout or execute PR code here.
name: OpenRouter profile completion
on:
  workflow_run:
    # Filter on the workflow YAML name; API run.name/display_title use run-name.
    # Verified live: Pro review34246675752 (OpenRouter PR #304: auto) triggered
    # completion34247027718 with event=workflow_run and SOURCE_RUN_ID=34246675752.
    workflows: [OpenRouter code review]
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional PR number; planning also refreshes other open PRs
        required: false
        type: string
permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write
jobs:
  # The shared CI validator authenticates this exact calling job id.
  complete:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: RetireGolden/.github/.github/workflows/openrouter-profile-completion.yml@05c616eae68252214effb03d8422e2ec56667fc7 # .github#49
    with:
      pr_number: ${{ inputs.pr_number || '' }}
      source_run_id: ${{ github.event.workflow_run.id && format('{0}', github.event.workflow_run.id) || '' }}
