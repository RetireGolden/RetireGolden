# Compatibility entry point: the normal trusted workflow owns every review lane.
name: OpenRouter review recovery
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR to review while retaining its findings
        required: true
        type: string
permissions:
  actions: write
  contents: read
  pull-requests: read
jobs:
  forward:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: openrouter-recovery-dispatch-${{ github.repository }}-${{ inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Dispatch the normal trusted profile review
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const raw = process.env.PR_NUMBER || ''
            if (!/^[1-9][0-9]*$/.test(raw) || !Number.isSafeInteger(Number(raw))) {
              throw new Error('pr_number must be a positive integer')
            }
            const { owner, repo } = context.repo
            const repository = context.payload.repository
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(raw) })
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== repository.default_branch ||
                pr.head.repo?.full_name !== repository.full_name) {
              throw new Error('Recovery requires an open same-repository PR targeting the default branch')
            }
            const prefix = `OpenRouter PR #${pr.number}: `
            // Include legacy recovery runs during migration. Their dispatch SHA is main
            // and their title may not identify a PR, so conservatively wait for them.
            for (const workflow_id of ['openrouter-code-review.yml', 'openrouter-review-recovery.yml']) {
              for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
                const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner, repo, workflow_id, status, per_page: 100,
                })
                // GitHub caps filtered searches at 1,000; truncation is not absence.
                if (runs.length >= 1000) throw new Error('Active review search reached its safety limit')
                if (runs.some(run => {
                  if (run.id === context.runId || run.status === 'completed') return false
                  if (workflow_id === 'openrouter-review-recovery.yml') return true
                  const titles = [run.name, run.display_title].filter(value => typeof value === 'string')
                  const hasPrTitle = titles.some(value => /^OpenRouter PR #[1-9][0-9]*: /.test(value))
                  return run.head_sha === pr.head.sha || titles.some(value => value.startsWith(prefix)) ||
                    (run.event === 'workflow_dispatch' && !hasPrTitle)
                })) {
                  throw new Error('Wait for current review runs to finish before recovery')
                }
              }
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'openrouter-code-review.yml',
              ref: repository.default_branch,
              inputs: { pr_number: String(pr.number), review_level: 'auto' },
            })
            core.info(`Dispatched the normal profile review for PR #${pr.number}; follow OpenRouter code review and profile completion.`)
  reject-other-branches:
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo 'Dispatch recovery from the default branch.' >&2; exit 1
