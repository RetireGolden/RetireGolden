name: OpenRouter review recovery

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing same-repository PR with an initial review ledger
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: openrouter-follow-up-${{ github.repository }}-${{ inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Resolve an open same-repository PR
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const raw = process.env.PR_NUMBER || ''
            if (!/^[1-9][0-9]*$/.test(raw) || !Number.isSafeInteger(Number(raw))) {
              throw new Error('pr_number must be a positive integer')
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(raw),
            })
            if (pr.state !== 'open' || pr.base.ref !== context.payload.repository.default_branch ||
                pr.head.repo?.full_name !== context.payload.repository.full_name) {
              throw new Error('Recovery requires an open same-repository PR targeting the default branch')
            }
            core.setOutput('number', String(pr.number))
            core.setOutput('head', pr.head.sha)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the existing review ledger
        id: review
        uses: FlyOverCoderKY/openrouter-pr-review-action@956b494594d8c7969ec9b355fd11d8e39b3b6161 # action PR31
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ steps.pr.outputs.number }}
          head_sha: ${{ steps.pr.outputs.head }}
          models: x-ai/grok-4.6,z-ai/glm-5.3-flash
          judge_model: openai/gpt-5.6-luna
          review_mode: verify
          # Full coverage avoids trusting the prior ledger to omit earlier commits
          # and supports recovery when the latest ledger already names this head.
          review_scope: full-pr
          effort: low
          max_tool_turns: '30'
          max_diff_kb: '600'
          fail_on: any
          roast_level: professional
      - name: Require a clean verification
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: test "$VERDICT" = clean
