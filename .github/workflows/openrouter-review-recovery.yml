name: OpenRouter review recovery

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing same-repository PR with an initial review ledger
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  reject-other-branches:
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo 'Dispatch recovery from the default branch.' >&2; exit 1
  verify:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      # Job concurrency supports inputs for workflow_dispatch; matches normal follow-up.
      # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts
      group: openrouter-follow-up-${{ github.repository }}-${{ inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Resolve an open same-repository PR
        id: pr
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const raw = process.env.PR_NUMBER || ''
            if (!/^[1-9][0-9]*$/.test(raw) || !Number.isSafeInteger(Number(raw))) {
              throw new Error('pr_number must be a positive integer')
            }
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(raw),
            })
            if (pr.state !== 'open' || pr.base.ref !== context.payload.repository.default_branch ||
                pr.head.repo?.full_name !== context.payload.repository.full_name) {
              throw new Error('Recovery requires an open same-repository PR targeting the default branch')
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'openrouter-code-review.yml', head_sha: pr.head.sha, per_page: 100,
            })
            if (runs.some(run => run.status !== 'completed')) {
              throw new Error('Wait for all exact-head OpenRouter review runs to finish before recovery')
            }
            core.setOutput('number', String(pr.number))
            core.setOutput('head', pr.head.sha)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the existing review ledger
        id: review
        uses: FlyOverCoderKY/openrouter-pr-review-action@481069edae02298d4069f03b24ad1cdc67c5f348 # action PR33
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ steps.pr.outputs.number }}
          head_sha: ${{ steps.pr.outputs.head }}
          models: x-ai/grok-4.6,z-ai/glm-5.3-flash
          judge_model: openai/gpt-5.6-luna
          review_mode: verify
          # Full coverage avoids trusting the prior ledger to omit earlier commits
          # and supports recovery when the latest ledger already names this head.
          review_scope: full-pr
          effort: low
          max_tool_turns: '30'
          max_diff_kb: '600'
          fail_on: any
          roast_level: professional
      - name: Require a clean verification
        env:
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: test "$VERDICT" = clean
