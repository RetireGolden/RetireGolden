# Publishes @retiregolden/engine to npm.
#
# Trigger by pushing a tag `engine-v<version>` (must match the packed package
# version), or manually via workflow_dispatch. Manual runs are dry-run only.
# The package is built and exercised without publish credentials; the
# environment-protected job receives only the verified tarball.

name: Publish engine package

on:
  push:
    tags: ['engine-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Use npm publish --dry-run (no release)
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject non-dry-run manual dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false'
        run: |
          echo "Manual dispatch is dry-run only. To publish for real, push a tag engine-v<version> matching packages/engine/package.json." >&2
          exit 1

  build-and-smoke:
    runs-on: ubuntu-latest
    needs: guard
    permissions:
      contents: read
    outputs:
      tarball_sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @retiregolden/engine lint

      - name: Build
        run: pnpm --filter @retiregolden/engine build

      - name: Test
        run: pnpm --filter @retiregolden/engine test

      - name: Pack release tarball and record digest
        id: pack
        working-directory: packages/engine
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/engine-package"
          mkdir -p "$artifact_dir"
          tarball_name="$(npm pack --pack-destination "$artifact_dir" --silent)"
          tarball="$artifact_dir/$tarball_name"
          if [ ! -f "$tarball" ]; then
            echo "Packed tarball was not created: $tarball" >&2
            exit 1
          fi
          digest="$(sha256sum "$tarball" | awk '{print $1}')"
          (cd "$artifact_dir" && sha256sum "$tarball_name" > package.sha256)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Smoke test the release tarball
        env:
          PACK_SMOKE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node packages/engine/scripts/pack-smoke.mjs

      - name: Upload release tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-package
          path: ${{ runner.temp }}/engine-package
          if-no-files-found: error
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    needs: [guard, build-and-smoke]
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download release tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-package
          path: ${{ runner.temp }}/engine-package

      - name: Set up Node for npm publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Remove npm auth placeholder so OIDC is used
        shell: bash
        run: |
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi

      - name: Install pinned npm for OIDC support
        run: npm install -g 'npm@11.5.1'

      - name: Verify tarball digest and package identity
        id: verify
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs['build-and-smoke'].outputs.tarball_sha256 }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          artifact_dir="$RUNNER_TEMP/engine-package"
          mapfile -t tarballs < <(find "$artifact_dir" -maxdepth 1 -type f -name '*.tgz' -print)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected one package tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          tarball="${tarballs[0]}"
          (cd "$artifact_dir" && sha256sum --check package.sha256)
          actual_sha256="$(sha256sum "$tarball" | awk '{print $1}')"
          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "Tarball digest does not match the build job output" >&2
            exit 1
          fi

          manifest_dir="$RUNNER_TEMP/engine-manifest"
          mkdir -p "$manifest_dir"
          tar -xzf "$tarball" -C "$manifest_dir" package/package.json
          manifest="$manifest_dir/package/package.json"
          package_name="$(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync(process.argv[1], 'utf8')).name)" "$manifest")"
          package_version="$(node -e "const fs=require('node:fs'); console.log(JSON.parse(fs.readFileSync(process.argv[1], 'utf8')).version)" "$manifest")"
          if [ "$package_name" != '@retiregolden/engine' ]; then
            echo "Packed package name is $package_name, expected @retiregolden/engine" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = 'push' ]; then
            case "$GITHUB_REF" in
              refs/tags/engine-v*) tag_version="${GITHUB_REF_NAME#engine-v}" ;;
              *) echo "Publish pushes must use an engine-v<version> tag" >&2; exit 1 ;;
            esac
            if [ "$tag_version" != "$package_version" ]; then
              echo "Tag engine-v$tag_version does not match packed package version $package_version" >&2
              exit 1
            fi
          elif [ "$EVENT_NAME" != 'workflow_dispatch' ]; then
            echo "Unsupported publish event: $EVENT_NAME" >&2
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARBALL: ${{ steps.verify.outputs.tarball }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            npm publish "$TARBALL" --access public --dry-run
          else
            npm publish "$TARBALL" --access public --provenance
          fi
