name: Owl Parity Oracle

on:
  workflow_dispatch:
    inputs:
      strict:
        description: Fail if Owl cannot be installed or any fixture is missing
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  owl-parity:
    name: Run Owl parity harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Owl parity
        working-directory: app
        env:
          STRICT: ${{ inputs.strict }}
        run: |
          args=(--install-owl)
          if [ "$STRICT" = "true" ]; then
            args+=(--strict-owl)
          fi
          pnpm owl-parity "${args[@]}"

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owl-parity
          path: app/artifacts/owl-parity
          retention-days: 14
