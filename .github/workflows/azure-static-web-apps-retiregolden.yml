# Azure Static Web Apps CI/CD
# See DOCS/operations/ci-cd-and-deploy.md

name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

# Every newer pull-request run cancels stale work. The broker applies `run-ci`
# and then reruns the existing exact-head placeholder; applying a label alone
# intentionally does not start another Azure workflow run.
concurrency:
  group: swa-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # This job does not check out code.  A rerun retains the original event
  # payload, so it reads the live PR and trusted review ledger from the API.
  authorize:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
    steps:
      - id: authorization
        name: Authorize live exact-head CI
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo
            const repository = context.payload.repository
            const defaultBranch = repository.default_branch
            const helperPin = 'a003ccfffe4c6772a0849c52af63b47085fd1044'
            const importHelper = async (content) => {
              if (typeof content !== 'string') throw new Error('trusted CI helper has invalid content')
              const helper = await import(`data:text/javascript;base64,${content.replace(/\s/g, '')}`)
              if (typeof helper.authorizeExactHeadPullRequest !== 'function') {
                throw new Error('trusted CI helper is missing authorization export')
              }
              return helper
            }
            const loadHelper = async () => {
              let helperFile
              try {
                helperFile = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: '.github/scripts/ci-acceleration.mjs',
                  ref: defaultBranch,
                })
              } catch (error) {
                // The immutable blob is only an inaugural bootstrap fallback:
                // default-branch helper load failures otherwise fail closed.
                if (error?.status !== 404) throw error
                const blob = await github.rest.git.getBlob({ owner, repo, file_sha: helperPin })
                return importHelper(blob.data?.content)
              }
              if (Array.isArray(helperFile.data) || helperFile.data?.type !== 'file') {
                throw new Error('trusted CI helper response is not a file')
              }
              return importHelper(helperFile.data.content)
            }
            const eventPr = context.payload.pull_request
            const requested = context.eventName === 'pull_request' && (
              context.runAttempt > 1 ||
              eventPr?.labels?.some((label) => label.name === 'run-ci')
            )
            try {
              if (context.eventName === 'push') {
                core.setOutput('authorized', 'true')
                core.info('authorized: push to main')
                return
              }
              const helper = await loadHelper()
              const result = await helper.authorizeExactHeadPullRequest(github, core, {
                owner,
                repo,
                repository,
                defaultBranch,
                eventPr: context.payload.pull_request,
                runAttempt: context.runAttempt,
              })
              core.setOutput('authorized', result.authorized ? 'true' : 'false')
              core.info(`${result.authorized ? 'authorized' : 'not authorized'}: ${result.reason}`)
              if (result.failJob) core.setFailed(result.reason)
            } catch (error) {
              core.setOutput('authorized', 'false')
              const message = error instanceof Error ? error.message : String(error)
              if (requested) core.setFailed(message)
              else core.info(`not authorized: ${message}`)
            }

  lint:
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (packages + app)
        run: pnpm lint

  test_engine:
    name: test engine
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Engine coverage thresholds
        run: pnpm --filter @retiregolden/engine test:coverage

  test_planner_ui:
    name: test planner-ui
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Planner UI coverage thresholds
        run: pnpm --filter @retiregolden/planner-ui test:coverage

  test_web:
    name: test web
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Web coverage thresholds
        run: pnpm --filter retiregolden-web test:coverage

  # Keep the existing required check context while making the coverage suites
  # independent parallel jobs.  `always()` lets this job turn a failed shard
  # into a real failure rather than a branch-protection-satisfying skip.
  test:
    name: test
    if: always() && !cancelled() && needs.authorize.outputs.authorized == 'true'
    needs: [authorize, test_engine, test_planner_ui, test_web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every coverage shard
        env:
          ENGINE: ${{ needs.test_engine.result }}
          PLANNER_UI: ${{ needs.test_planner_ui.result }}
          WEB: ${{ needs.test_web.result }}
        run: |
          test "$ENGINE" = success
          test "$PLANNER_UI" = success
          test "$WEB" = success

  e2e:
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser layout tests
        working-directory: app
        run: pnpm test:e2e

  build:
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check + Build (packages, then app)
        run: pnpm build
      - name: Third-party notices are current
        run: |
          pnpm --filter retiregolden-web run licenses
          git diff --exit-code -- app/THIRD-PARTY-NOTICES.txt app/public/THIRD-PARTY-NOTICES.txt
      - name: Smoke test the packed engine artifact
        run: node packages/engine/scripts/pack-smoke.mjs
      - name: Smoke test the packed planner-ui artifact
        run: node packages/planner-ui/scripts/pack-smoke.mjs
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: app/dist
          retention-days: 1

  deploy:
    if: >-
      always() && needs.authorize.outputs.authorized == 'true' &&
      needs.lint.result == 'success' && needs.test.result == 'success' &&
      needs.e2e.result == 'success' && needs.build.result == 'success'
    needs: [authorize, lint, test, e2e, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      preview_url: ${{ steps.builddeploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: app/dist
      - uses: ./.github/actions/setup-toolchain
        with:
          pnpm: 'false'
      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          skip_app_build: true
          app_location: app/dist
          api_location: ''
          output_location: ''

  dast:
    name: ZAP DAST
    # Unauthorized PRs retain the empty-URL reusable invocation so the nested
    # required check is skipped, not left Expected.  Authorized PRs reach ZAP
    # only after every gate and preview deployment succeeds.
    if: >-
      !cancelled() && github.event_name == 'pull_request' && github.event.action != 'closed' &&
      (needs.authorize.outputs.authorized != 'true' || needs.deploy.result == 'success')
    needs: [authorize, deploy]
    uses: ./.github/workflows/zap.yml
    permissions:
      contents: read
    with:
      target_url: ${{ needs.deploy.outputs.preview_url }}

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
