# Azure Static Web Apps CI/CD
# See DOCS/operations/ci-cd-and-deploy.md

name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Every newer pull-request run cancels stale work. The broker applies `run-ci`
# and then reruns the existing exact-head placeholder; applying a label alone
# intentionally does not start another Azure workflow run.
concurrency:
  group: swa-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fork_zap_gate:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ZAP DAST / ZAP Baseline' || 'fork ZAP gate (not applicable)' }}
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a same-repository preview
        run: echo 'Fork pull requests do not receive preview deployment or DAST.' >&2; exit 1

  # This job does not check out code.  A rerun retains the original event
  # payload, so it reads the live PR and trusted review ledger from the API.
  authorize:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
    steps:
      - id: authorization
        name: Authorize live exact-head CI
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo
            const repository = context.payload.repository
            const defaultBranch = repository.default_branch
            const helperPin = 'e0c305c8668e488f93f6bb185d461a4bddd05874'
            const importHelper = async (content) => {
              if (typeof content !== 'string') throw new Error('trusted CI helper has invalid content')
              const helper = await import(`data:text/javascript;base64,${content.replace(/\s/g, '')}`)
              if (typeof helper.authorizeExactHeadPullRequest !== 'function') {
                throw new Error('trusted CI helper is missing authorization export')
              }
              return helper
            }
            const loadPinnedHelper = async () => {
              const blob = await github.rest.git.getBlob({ owner, repo, file_sha: helperPin })
              return importHelper(blob.data?.content)
            }
            const loadHelper = async () => {
              let helperFile
              try {
                helperFile = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: '.github/scripts/ci-acceleration.mjs',
                  ref: defaultBranch,
                })
              } catch (error) {
                // The immutable blob is only an inaugural bootstrap fallback:
                // default-branch helper load failures otherwise fail closed.
                if (error?.status !== 404) throw error
                return loadPinnedHelper()
              }
              if (Array.isArray(helperFile.data) || helperFile.data?.type !== 'file') {
                throw new Error('trusted CI helper response is not a file')
              }
              return importHelper(helperFile.data.content)
            }
            try {
              if (context.eventName === 'push') {
                core.setOutput('authorized', 'true')
                core.info('authorized: push to main')
                return
              }
              const authorizationInput = {
                owner,
                repo,
                repository,
                defaultBranch,
                eventPr: context.payload.pull_request,
                runAttempt: context.runAttempt,
              }
              let helper = await loadHelper()
              let result = await helper.authorizeExactHeadPullRequest(github, core, authorizationInput)
              if (!result.authorized &&
                  (result.reason === 'cannot verify the pull_request_target base history' ||
                    result.reason.startsWith('cannot verify pull_request_target provenance:'))) {
                core.warning('Retrying cutover authorization with the reviewed immutable helper')
                helper = await loadPinnedHelper()
                result = await helper.authorizeExactHeadPullRequest(github, core, authorizationInput)
              }
              core.setOutput('authorized', result.authorized ? 'true' : 'false')
              core.info(`${result.authorized ? 'authorized' : 'not authorized'}: ${result.reason}`)
              if (!result.authorized) core.setFailed(result.reason)
            } catch (error) {
              core.setOutput('authorized', 'false')
              const message = error instanceof Error ? error.message : String(error)
              core.setFailed(message)
            }

  lint:
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (packages + app)
        run: pnpm lint
      - name: Workflow contract tests
        run: node --test .github/scripts/ci-workflows.test.mjs

  test_engine:
    name: test engine
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Engine coverage thresholds
        run: pnpm --filter @retiregolden/engine test:coverage

  test_planner_ui:
    name: test planner-ui
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Planner UI coverage thresholds
        run: pnpm --filter @retiregolden/planner-ui test:coverage

  test_web:
    name: test web
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Web coverage thresholds
        run: pnpm --filter retiregolden-web test:coverage

  # Keep the existing required check context while making the coverage suites
  # independent parallel jobs.  `always()` lets this job turn a failed shard
  # into a real failure rather than a branch-protection-satisfying skip.
  test:
    name: test
    if: always() && !cancelled() && needs.authorize.outputs.authorized == 'true'
    needs: [authorize, test_engine, test_planner_ui, test_web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every coverage shard
        env:
          ENGINE: ${{ needs.test_engine.result }}
          PLANNER_UI: ${{ needs.test_planner_ui.result }}
          WEB: ${{ needs.test_web.result }}
        run: |
          test "$ENGINE" = success
          test "$PLANNER_UI" = success
          test "$WEB" = success

  e2e:
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser layout tests
        working-directory: app
        run: pnpm test:e2e

  build:
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check + Build (packages, then app)
        run: pnpm build
      - name: Third-party notices are current
        run: |
          pnpm --filter retiregolden-web run licenses
          git diff --exit-code -- app/THIRD-PARTY-NOTICES.txt app/public/THIRD-PARTY-NOTICES.txt
      - name: Smoke test the packed engine artifact
        run: node packages/engine/scripts/pack-smoke.mjs
      - name: Smoke test the packed planner-ui artifact
        run: node packages/planner-ui/scripts/pack-smoke.mjs
      # The dev-server e2e job cannot see the production chunk graph. This
      # runs the built dist through `vite preview` and pins the funding
      # fixed point and depletion reporting on the Results page
      # (app/e2e-dist, app/playwright.dist.config.ts).
      - name: Install Playwright browser
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests against the production build
        working-directory: app
        run: pnpm test:e2e:dist
      # Uploaded even when the dist spec (or a step after the build) fails:
      # the built chunk graph is the evidence for exactly that failure. The
      # trusted default-branch controller deploys only a successful source run.
      - name: Upload build output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: app/dist
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload production-build Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-dist-results
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 7
