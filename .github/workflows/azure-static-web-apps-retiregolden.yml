# Azure Static Web Apps CI/CD
# See DOCS/operations/ci-cd-and-deploy.md

name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, closed]
    branches: [main]

# A newer PR commit cancels stale work.  The broker reruns the existing
# unlabeled pull_request run after applying run-ci with GITHUB_TOKEN, whose
# label event intentionally does not trigger another workflow run.
concurrency:
  group: swa-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'run-ci') }}

permissions:
  contents: read

jobs:
  # This job does not check out code.  A rerun retains the original event
  # payload, so it reads the live PR and trusted review ledger from the API.
  authorize:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
      (github.run_attempt > 1 || github.event.action != 'labeled' || github.event.label.name == 'run-ci'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
    steps:
      - id: authorization
        name: Authorize live exact-head CI
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            if (context.eventName === 'push') {
              core.setOutput('authorized', 'true')
              core.info('authorized: push to main')
              return
            }
            const { owner, repo } = context.repo
            const repository = context.payload.repository
            const eventPr = context.payload.pull_request
            const expectedHeadSha = eventPr.head.sha
            const trustedReviewWorkflowId = 341686683
            const trustedReusableReviewWorkflow = 'RetireGolden/.github/.github/workflows/openrouter-code-review.yml@f6aa157430509b5f6945b4fc2c9fafeeac4a7294'
            const trustedReusableReviewWorkflowSha = 'f6aa157430509b5f6945b4fc2c9fafeeac4a7294'
            const decodeLedgerPayload = (encoded) => {
              if (!/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(encoded)) return undefined
              try {
                const decoded = Buffer.from(encoded, 'base64').toString('utf8')
                if (Buffer.from(decoded, 'utf8').toString('base64') !== encoded) return undefined
                const payload = JSON.parse(decoded)
                return payload !== null && typeof payload === 'object' && !Array.isArray(payload) ? payload : undefined
              } catch {
                return undefined
              }
            }
            const trustedReviewLedger = (review, workflowRunUrls) => {
              const body = typeof review.body === 'string' ? review.body : ''
              const lines = body.split(/\r?\n/)
              if (lines.at(-1) === '') lines.pop()
              const marker = /^<!-- openrouter-review-ledger:v1:([A-Za-z0-9+/=]+) -->$/.exec(lines[1] ?? '')
              const payload = marker && decodeLedgerPayload(marker[1])
              const verdict = /^\*\*Verdict:\*\* `(clean|issues)`$/.exec(lines[3] ?? '')?.[1]
              const validPayload = payload?.lv === 1 && payload.repo === repository.full_name &&
                payload.pr === eventPr.number && payload.sha === expectedHeadSha &&
                typeof payload.gen === 'string' && /^[a-f0-9]{12}$/.test(payload.gen) &&
                Number.isSafeInteger(payload.round) && payload.round > 0 && Array.isArray(payload.findings) &&
                ((verdict === 'clean' && payload.findings.length === 0) ||
                  (verdict === 'issues' && payload.findings.length > 0))
              const trusted = review.user?.login === 'github-actions[bot]' &&
                review.user?.id === 41898282 && review.user?.type === 'Bot' && review.state === 'COMMENTED' &&
                typeof review.commit_id === 'string' && review.commit_id === expectedHeadSha &&
                lines[0] === '## OpenRouter pull-request review' && lines[2] === '' &&
                verdict !== undefined && lines[4]?.startsWith('**Scope:** `') &&
                lines[5]?.startsWith('**Mode:** `') && lines[6] === `**Commit:** \`${expectedHeadSha}\`` &&
                workflowRunUrls.some((url) => lines.at(-1) === `[Workflow run](${url})`) &&
                validPayload
              return trusted ? verdict : undefined
            }
            const isLiveExpectedPr = (candidate) => candidate.state === 'open' &&
              candidate.base?.ref === 'main' &&
              candidate.head?.repo?.full_name === context.payload.repository.full_name &&
              candidate.head?.sha === expectedHeadSha
            const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: expectedHeadSha, per_page: 100,
            })
            const liveAssociatedPrs = []
            for (const association of associated) {
              const { data: candidate } = await github.rest.pulls.get({
                owner, repo, pull_number: association.number,
              })
              if (isLiveExpectedPr(candidate)) liveAssociatedPrs.push(candidate)
            }
            if (liveAssociatedPrs.length !== 1 || liveAssociatedPrs[0].number !== eventPr.number) {
              core.setOutput('authorized', 'false')
              return core.info(`not authorized: expected exactly one live same-repository PR at ${expectedHeadSha}`)
            }
            const pr = liveAssociatedPrs[0]
            if (!pr.labels.some((label) => label.name === 'run-ci')) {
              core.setOutput('authorized', 'false')
              return core.info('not authorized: live PR does not have run-ci')
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr.number, per_page: 100,
            })
            const reviewRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'openrouter-code-review.yml', per_page: 100,
            })
            let defaultCaller
            try {
              defaultCaller = await github.rest.repos.getContent({
                owner, repo, path: '.github/workflows/openrouter-code-review.yml', ref: repository.default_branch,
              })
            } catch {
              core.setOutput('authorized', 'false')
              return core.info('not authorized: cannot read trusted default-branch OpenRouter caller')
            }
            const provenanceReviewRuns = []
            for (const run of reviewRuns) {
              const isTrustedRun = run.name === 'OpenRouter code review' && run.event === 'pull_request' &&
                run.workflow_id === trustedReviewWorkflowId && run.head_sha === expectedHeadSha &&
                run.path === '.github/workflows/openrouter-code-review.yml' &&
                Array.isArray(run.referenced_workflows) && run.referenced_workflows.some(
                  (workflow) => workflow?.path === trustedReusableReviewWorkflow &&
                    workflow?.sha === trustedReusableReviewWorkflowSha,
                ) &&
                run.head_repository?.full_name === repository.full_name
              if (!isTrustedRun) continue
              try {
                const headCaller = await github.rest.repos.getContent({
                  owner, repo, path: '.github/workflows/openrouter-code-review.yml', ref: run.head_sha,
                })
                if (!Array.isArray(headCaller.data) && headCaller.data.type === 'file' &&
                  !Array.isArray(defaultCaller.data) && defaultCaller.data.type === 'file' &&
                  typeof headCaller.data.sha === 'string' && headCaller.data.sha === defaultCaller.data.sha) {
                  provenanceReviewRuns.push(run)
                }
              } catch {
                core.info(`not authorized: cannot prove trusted caller blob for OpenRouter run ${run.id}`)
              }
            }
            const reviewRunOrder = (left, right) => {
              for (const [leftValue, rightValue] of [
                [Date.parse(left.created_at ?? '') || -Infinity, Date.parse(right.created_at ?? '') || -Infinity],
                [Number.isSafeInteger(left.run_number) ? left.run_number : -Infinity, Number.isSafeInteger(right.run_number) ? right.run_number : -Infinity],
                [Number.isSafeInteger(left.run_attempt) ? left.run_attempt : -Infinity, Number.isSafeInteger(right.run_attempt) ? right.run_attempt : -Infinity],
                [Number.isSafeInteger(left.id) ? left.id : -Infinity, Number.isSafeInteger(right.id) ? right.id : -Infinity],
              ]) {
                if (leftValue !== rightValue) return rightValue > leftValue ? 1 : -1
              }
              return 0
            }
            const authoritativeReviewRun = provenanceReviewRuns.sort(reviewRunOrder)[0]
            if (!authoritativeReviewRun || authoritativeReviewRun.status !== 'completed' ||
              authoritativeReviewRun.conclusion !== 'success') {
              core.setOutput('authorized', 'false')
              return core.info('not authorized: newest provenance-valid exact-head OpenRouter run is not successful')
            }
            const workflowRunUrls = [`https://github.com/${owner}/${repo}/actions/runs/${authoritativeReviewRun.id}`]
            const latestExactHeadBotReview = reviews.reduce((newest, review, index) => {
              const exactHeadBotReview = review.user?.login === 'github-actions[bot]' &&
                review.user?.id === 41898282 && review.user?.type === 'Bot' &&
                typeof review.commit_id === 'string' && review.commit_id === expectedHeadSha
              if (!exactHeadBotReview) return newest
              const candidate = { review, index }
              if (!newest) return candidate
              const newestTime = Date.parse(newest.review.submitted_at ?? '') || -Infinity
              const candidateTime = Date.parse(review.submitted_at ?? '') || -Infinity
              if (candidateTime !== newestTime) return candidateTime > newestTime ? candidate : newest
              const newestId = newest.review.id ?? -Infinity
              const candidateId = review.id ?? -Infinity
              return candidateId > newestId || (candidateId === newestId && index > newest.index)
                ? candidate
                : newest
            }, undefined)
            const latestVerdict = latestExactHeadBotReview &&
              trustedReviewLedger(latestExactHeadBotReview.review, workflowRunUrls)
            if (latestVerdict !== 'clean') {
              core.setOutput('authorized', 'false')
              return core.info('not authorized: latest exact current-head OpenRouter bot review is not a clean authoritative ledger')
            }
            // Re-read immediately before releasing code-execution jobs: a new
            // commit after the API work must fail closed rather than test it.
            const { data: finalPr } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number })
            if (!isLiveExpectedPr(finalPr) || !finalPr.labels.some((label) => label.name === 'run-ci')) {
              core.setOutput('authorized', 'false')
              return core.info('not authorized: PR head/state/repository/label changed during authorization')
            }
            core.setOutput('authorized', 'true')
            core.info(`authorized: exact-head trusted clean review for ${expectedHeadSha}`)

  lint:
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint (packages + app)
        run: pnpm lint

  test_engine:
    name: test engine
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Engine coverage thresholds
        run: pnpm --filter @retiregolden/engine test:coverage

  test_planner_ui:
    name: test planner-ui
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Planner UI coverage thresholds
        run: pnpm --filter @retiregolden/planner-ui test:coverage

  test_web:
    name: test web
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Web coverage thresholds
        run: pnpm --filter retiregolden-web test:coverage

  # Keep the existing required check context while making the coverage suites
  # independent parallel jobs.  `always()` lets this job turn a failed shard
  # into a real failure rather than a branch-protection-satisfying skip.
  test:
    name: test
    if: always() && needs.authorize.outputs.authorized == 'true'
    needs: [authorize, test_engine, test_planner_ui, test_web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every coverage shard
        env:
          ENGINE: ${{ needs.test_engine.result }}
          PLANNER_UI: ${{ needs.test_planner_ui.result }}
          WEB: ${{ needs.test_web.result }}
        run: |
          test "$ENGINE" = success
          test "$PLANNER_UI" = success
          test "$WEB" = success

  e2e:
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser layout tests
        working-directory: app
        run: pnpm test:e2e

  build:
    if: needs.authorize.outputs.authorized == 'true'
    needs: [authorize]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check + Build (packages, then app)
        run: pnpm build
      - name: Third-party notices are current
        run: |
          pnpm --filter retiregolden-web run licenses
          git diff --exit-code -- app/THIRD-PARTY-NOTICES.txt app/public/THIRD-PARTY-NOTICES.txt
      - name: Smoke test the packed engine artifact
        run: node packages/engine/scripts/pack-smoke.mjs
      - name: Smoke test the packed planner-ui artifact
        run: node packages/planner-ui/scripts/pack-smoke.mjs
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0 # v7.0.1
        with:
          name: dist
          path: app/dist
          retention-days: 1

  deploy:
    if: >-
      always() && needs.authorize.outputs.authorized == 'true' &&
      needs.lint.result == 'success' && needs.test.result == 'success' &&
      needs.e2e.result == 'success' && needs.build.result == 'success'
    needs: [authorize, lint, test, e2e, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      preview_url: ${{ steps.builddeploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: app/dist
      - uses: ./.github/actions/setup-toolchain
        with:
          pnpm: 'false'
      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          skip_app_build: true
          app_location: app/dist
          api_location: ''
          output_location: ''

  dast:
    name: ZAP DAST
    # Unauthorized PRs retain the empty-URL reusable invocation so the nested
    # required check is skipped, not left Expected.  Authorized PRs reach ZAP
    # only after every gate and preview deployment succeeds.
    if: >-
      !cancelled() && github.event_name == 'pull_request' && github.event.action != 'closed' &&
      (needs.authorize.outputs.authorized != 'true' || needs.deploy.result == 'success')
    needs: [authorize, deploy]
    uses: ./.github/workflows/zap.yml
    permissions:
      contents: read
    with:
      target_url: ${{ needs.deploy.outputs.preview_url }}

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
