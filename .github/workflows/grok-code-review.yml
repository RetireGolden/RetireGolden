# Thin caller for the org-required Grok Build PR review.
# Implementation lives in RetireGolden/.github — do not copy it here.
#
# Green-on-partial is intentional (.github#26): when a diff exceeds
# the embed cap it is truncated, Grok still reviews the full PR with
# read-only tools, and the run completes with an explicit `partial`
# verdict, which grok-first-pass-gate accepts. A green gate on
# `partial` means the embed was incomplete, not that review was
# skipped; partial runs never publish review-loop ledger state, so
# follow-up rounds re-review from the last complete marker.
name: Grok code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: write

jobs:
  review:
    uses: RetireGolden/.github/.github/workflows/grok-code-review.yml@ed323b2437d45eaec4ca6955c384bcf19aeb8357 # .github#26 (action v1.0.6 dense-PR truncation degrades to partial)
    with:
      pr_number: ${{ inputs.pr_number || github.event.inputs.pr_number || github.event.pull_request.number }}
    secrets:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
