# Manual emergency caller for the legacy Grok Build PR review.
# Implementation lives in RetireGolden/.github — do not copy it here.
#
# This workflow intentionally has no pull_request trigger. It is independent
# of the required OpenRouter workflow and spends xAI tokens only when a human
# explicitly dispatches it for a PR number.
name: Grok code review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: write

jobs:
  review:
    uses: RetireGolden/.github/.github/workflows/grok-code-review.yml@97b571df12df0089cff3dd310bcad907b5c94cab # .github#30 (Grok action v1.0.8 manual safeguards)
    with:
      pr_number: ${{ inputs.pr_number }}
    secrets:
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
