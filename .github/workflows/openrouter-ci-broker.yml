# Trusted default-branch broker: it never checks out or runs PR code. Its
# github-script step consumes GitHub API data and trusted default-branch code.
name: OpenRouter CI broker

on:
  workflow_run:
    workflows: [OpenRouter code review, Azure Static Web Apps CI/CD]
    types: [completed]

# Review and Azure completion events for one head can arrive together.  Keep
# their label/rerun decision serialized without cancelling a valid broker run.
concurrency:
  group: openrouter-ci-broker-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  authorize-and-rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize exact-head CI and rerun skipped PR workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const trigger = context.payload.workflow_run
            const { owner, repo } = context.repo
            const helperFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: '.github/scripts/ci-acceleration.mjs',
              ref: context.payload.repository.default_branch,
            })
            if (Array.isArray(helperFile.data) || helperFile.data.type !== 'file') {
              return core.info('skip: trusted CI helper is not a default-branch file')
            }
            const helper = await import(`data:text/javascript;base64,${helperFile.data.content.replace(/\s/g, '')}`)
            const isReviewTrigger = trigger.name === 'OpenRouter code review'
            const triggerReason = isReviewTrigger
              ? helper.reviewRunSkipReason(trigger, context.payload.repository)
              : helper.azureRunSkipReason(trigger)
            if (triggerReason) return core.info(`skip: ${triggerReason}`)

            const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: trigger.head_sha, per_page: 100,
            })
            const livePrs = []
            for (const association of associated) {
              const { data: candidate } = await github.rest.pulls.get({
                owner, repo, pull_number: association.number,
              })
              if (!helper.pullRequestSkipReason(candidate, context.payload.repository, trigger.head_sha)) {
                livePrs.push(candidate)
              }
            }
            if (livePrs.length !== 1) {
              return core.info(`skip: expected exactly one live same-repository PR at ${trigger.head_sha}, found ${livePrs.length}`)
            }
            const pr = livePrs[0]
            if (helper.isDependabotPullRequest(pr)) {
              return core.info(`skip: broker does not auto-rerun Dependabot PR #${pr.number}`)
            }

            const reviewRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'openrouter-code-review.yml', per_page: 100,
            })
            let defaultCaller
            try {
              defaultCaller = await github.rest.repos.getContent({
                owner, repo, path: '.github/workflows/openrouter-code-review.yml',
                ref: context.payload.repository.default_branch,
              })
            } catch {
              return core.info('skip: cannot read trusted default-branch OpenRouter caller')
            }
            const provenanceReviewRuns = []
            for (const run of reviewRuns) {
              if (run.head_sha !== trigger.head_sha || helper.reviewRunSkipReason(run, context.payload.repository)) continue
              try {
                const headCaller = await github.rest.repos.getContent({
                  owner, repo, path: '.github/workflows/openrouter-code-review.yml', ref: run.head_sha,
                })
                if (helper.workflowBlobMatchesDefaultBranch(headCaller, defaultCaller)) provenanceReviewRuns.push(run)
              } catch {
                core.info(`skip: cannot prove trusted caller blob for OpenRouter run ${run.id}`)
              }
            }
            if (isReviewTrigger && !provenanceReviewRuns.some((run) => run.id === trigger.id)) {
              return core.info(`skip: triggering OpenRouter run ${trigger.id} lacks trusted caller provenance`)
            }
            const authoritativeReviewRun = helper.newestWorkflowRun(provenanceReviewRuns)
            if (!authoritativeReviewRun) return core.info(`skip: no provenance-valid exact-head OpenRouter run for PR #${pr.number}`)
            if (authoritativeReviewRun.status !== 'completed' || authoritativeReviewRun.conclusion !== 'success') {
              return core.info(`skip: newest provenance-valid OpenRouter run ${authoritativeReviewRun.id} is not successful`)
            }
            const reviewUrls = [helper.workflowRunUrl(owner, repo, authoritativeReviewRun.id)]

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number: pr.number, per_page: 100,
            })
            if (!helper.findTrustedCleanReview(reviews, {
              repository: context.payload.repository,
              pullNumber: pr.number,
              headSha: trigger.head_sha,
              workflowRunUrls: reviewUrls,
            })) {
              return core.info(`skip: latest exact-head OpenRouter bot review is not a clean ledger for the authoritative run on PR #${pr.number}`)
            }

            // Discover a concrete skipped run before mutating the PR.  A label
            // without a runnable placeholder would strand CI in a labeled but
            // unstarted state because GITHUB_TOKEN label events do not trigger
            // this workflow.
            const azureRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'azure-static-web-apps-retiregolden.yml', event: 'pull_request', per_page: 100,
            })
            const currentHeadRuns = azureRuns.filter((run) =>
              run.head_sha === trigger.head_sha && !helper.azureRunSkipReason(run),
            )
            const jobLists = new Map()
            for (const run of currentHeadRuns) {
              if (run.status !== 'completed') continue
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: run.id, per_page: 100,
              })
              jobLists.set(run.id, jobs)
            }
            if (helper.hasActiveOrRealAzureWork(currentHeadRuns, jobLists)) {
              return core.info(`skip: Azure CI is active or has real expensive work for PR #${pr.number} at ${trigger.head_sha}`)
            }
            const eligible = currentHeadRuns
              .filter((run) => run.status === 'completed' && run.run_attempt === 1 &&
                helper.hasOnlySkippedExpensiveAzureJobs(jobLists.get(run.id) ?? []))
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0]
            if (!eligible) return core.info(`skip: no completed all-expensive-skipped Azure run for PR #${pr.number} at ${trigger.head_sha}`)

            const { data: finalPr } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number })
            const finalReason = helper.pullRequestSkipReason(finalPr, context.payload.repository, trigger.head_sha)
            if (finalReason) return core.info(`skip: ${finalReason}`)
            if (!finalPr.labels.some((label) => label.name === 'run-ci')) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['run-ci'] })
              core.info(`added run-ci to PR #${pr.number} at ${trigger.head_sha}`)
            } else {
              core.info(`PR #${pr.number} already has run-ci at ${trigger.head_sha}`)
            }
            const { data: postLabelPr } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number })
            const postLabelReason = helper.pullRequestSkipReason(postLabelPr, context.payload.repository, trigger.head_sha)
            if (postLabelReason || !postLabelPr.labels.some((label) => label.name === 'run-ci')) {
              return core.info(`skip: ${postLabelReason ?? 'run-ci label changed during authorization'}`)
            }
            await github.rest.actions.reRunWorkflow({ owner, repo, run_id: eligible.id })
            core.info(`reran Azure workflow run ${eligible.id} for PR #${pr.number} at ${trigger.head_sha}`)
