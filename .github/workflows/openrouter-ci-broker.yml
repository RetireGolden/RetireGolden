# Trusted default-branch broker: it never checks out or runs PR code. Its
# github-script step consumes GitHub API data and trusted default-branch code.
name: OpenRouter CI broker

on:
  workflow_run:
    workflows: [OpenRouter code review, OpenRouter profile completion, Azure Static Web Apps CI/CD]
    types: [completed]

# Every wake-up inspects all open PRs under one repository-wide lock.
# GitHub can coalesce pending events; the surviving sweep still visits every PR.
# Profile runs carry main SHA, so event-head locks cannot serialize these decisions.
concurrency:
  group: openrouter-ci-broker
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  authorize-and-rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize exact-head CI and rerun skipped PR workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo
            const defaultBranch = context.payload.repository.default_branch
            const helperFile = await github.rest.repos.getContent({
              owner,
              repo,
              path: '.github/scripts/ci-acceleration.mjs',
              ref: defaultBranch,
            })
            if (Array.isArray(helperFile.data) || helperFile.data.type !== 'file') {
              return core.info('skip: trusted CI helper is not a default-branch file')
            }
            const helper = await import(`data:text/javascript;base64,${helperFile.data.content.replace(/\s/g, '')}`)
            // Events are wake-up hints, never authorization. Sweep all open PRs
            // so a coalesced pending event cannot lose another PR's ready state.
            const pendingPrs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: defaultBranch, per_page: 100,
            })
            const authorizeOne = async (candidate) => {
              const { data: pr } = await github.rest.pulls.get({
                owner, repo, pull_number: candidate.number,
              })
              const expectedHeadSha = pr.head?.sha
              const initialReason = helper.pullRequestSkipReason(pr, context.payload.repository, expectedHeadSha)
              if (initialReason) return core.info(`skip: ${initialReason}`)
              if (helper.isDependabotPullRequest(pr)) {
                return core.info(`skip: broker does not auto-rerun Dependabot PR #${pr.number}`)
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: pr.number, per_page: 100,
              })
              const { provenanceReviewRuns, error } = await helper.collectProvenanceReviewRuns(github, {
                owner,
                repo,
                repository: context.payload.repository,
                defaultBranch,
                expectedHeadSha: expectedHeadSha,
                pullNumber: pr.number,
                reviews,
                allowDispatch: true,
              })
              if (error) return core.info(`skip: ${error}`)
              const authoritativeReviewRun = helper.newestWorkflowRun(provenanceReviewRuns)
              if (!authoritativeReviewRun) return core.info(`skip: no provenance-valid exact-head OpenRouter run for PR #${pr.number}`)
              if (authoritativeReviewRun.status !== 'completed' || authoritativeReviewRun.conclusion !== 'success') {
                return core.info(`skip: newest provenance-valid OpenRouter run ${authoritativeReviewRun.id} is not successful`)
              }
              const authoritativeRunUrl = helper.workflowRunUrl(owner, repo, authoritativeReviewRun.id)
              const cleanReview = helper.findTrustedCleanReview(reviews, {
                repository: context.payload.repository,
                pullNumber: pr.number,
                headSha: expectedHeadSha,
                workflowRunUrl: authoritativeRunUrl,
              })
              if (!cleanReview) {
                return core.info(`skip: latest exact-head OpenRouter bot review is not a clean ledger for the authoritative run on PR #${pr.number}`)
              }

              const profile = await helper.authorizeReviewProfile(github, {
                owner, repo, repository: context.payload.repository, defaultBranch,
                headSha: expectedHeadSha, pullNumber: pr.number,
                review: cleanReview, reviewRun: authoritativeReviewRun,
              })
              if (!profile.authorized) return core.info(`skip: ${profile.reason}`)

              const azureRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner,
                repo,
                workflow_id: 'azure-static-web-apps-retiregolden.yml',
                event: 'pull_request',
                head_sha: expectedHeadSha,
                per_page: 100,
              })
              const currentHeadRuns = azureRuns.filter((run) =>
                run.head_sha === expectedHeadSha && !helper.azureRunSkipReason(run),
              )
              const jobLists = new Map()
              for (const run of currentHeadRuns) {
                if (run.status !== 'completed') continue
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner, repo, run_id: run.id, per_page: 100,
                })
                jobLists.set(run.id, jobs)
              }
              if (helper.hasActiveOrRealAzureWork(currentHeadRuns, jobLists)) {
                return core.info(`skip: Azure CI is active or has real expensive work for PR #${pr.number} at ${expectedHeadSha}`)
              }
              const eligible = currentHeadRuns
                .filter((run) => run.status === 'completed' && run.run_attempt === 1 &&
                  helper.hasOnlySkippedExpensiveAzureJobs(jobLists.get(run.id) ?? []))
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0]
              if (!eligible) return core.info(`skip: no completed all-expensive-skipped Azure run for PR #${pr.number} at ${expectedHeadSha}`)

              const { data: finalPr } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number })
              const finalReason = helper.pullRequestSkipReason(finalPr, context.payload.repository, expectedHeadSha)
              if (finalReason) return core.info(`skip: ${finalReason}`)
              if (!finalPr.labels.some((label) => label.name === 'run-ci')) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['run-ci'] })
                core.info(`added run-ci to PR #${pr.number} at ${expectedHeadSha}`)
              } else {
                core.info(`PR #${pr.number} already has run-ci at ${expectedHeadSha}`)
              }
              const { data: postLabelPr } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number })
              const postLabelReason = helper.pullRequestSkipReason(postLabelPr, context.payload.repository, expectedHeadSha)
              if (postLabelReason || !postLabelPr.labels.some((label) => label.name === 'run-ci')) {
                return core.info(`skip: ${postLabelReason ?? 'run-ci label changed during authorization'}`)
              }
              await github.rest.actions.reRunWorkflow({ owner, repo, run_id: eligible.id })
              core.info(`reran Azure workflow run ${eligible.id} for PR #${pr.number} at ${expectedHeadSha}`)
            }
            let failures = 0
            for (const candidate of pendingPrs) {
              try {
                await authorizeOne(candidate)
              } catch {
                failures += 1
                core.warning(`CI authorization could not complete for PR #${candidate.number}`)
              }
            }
            if (failures) core.setFailed(`CI authorization failed for ${failures} PR(s)`)
